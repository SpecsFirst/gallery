<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<link rel="alternate" type="application/json" href="{{ root }}api/v1/templates.json">
<link rel="stylesheet" href="{{ root }}assets/site.css">
<script src="{{ root }}assets/site.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap {% block wrap %}{% endblock %}">
<header>
  <a class="brand" href="{{ root or './' }}">{% block logo %}{% endblock %}<span>SpecsFirst</span></a>
  <nav>
{% block nav %}{% endblock %}
  </nav>
</header>
<main id="main">
{% block content %}{% endblock %}
</main>
</div>
</body>
</html>
