name: Publish gallery

# Never pull_request or pull_request_target: this workflow holds a token and deploys.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Creates the Discussion each star button opens. Reads only the registry of main.
  discussions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      discussions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create missing Discussions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m gallery.discussions

  build:
    # A failed creation leaves a red job but the site is still published.
    needs: discussions
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      discussions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      # No token in the environment of this step: it clones strangers' repositories.
      - name: Detect templates
        run: |
          mkdir -p "$RUNNER_TEMP/gallery-data"
          uv run python -m gallery.detect --output "$RUNNER_TEMP/gallery-data/detected.json"

      - name: Check that detection worked
        run: |
          jq -e '(.templates | length) == 0 or any(.templates[]; .status == "ok")' \
            "$RUNNER_TEMP/gallery-data/detected.json" > /dev/null \
            || { echo "::error::no template was detected successfully"; exit 1; }

      - name: Count votes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m gallery.votes --output "$RUNNER_TEMP/gallery-data/votes.json"

      - name: Build site
        run: |
          uv run python -m gallery.build \
            --detected "$RUNNER_TEMP/gallery-data/detected.json" \
            --votes "$RUNNER_TEMP/gallery-data/votes.json" \
            --output _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
